<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>薯条早报</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:#f2f2f2;color:#222;font-size:15px;line-height:1.5}
.app{max-width:375px;min-height:100vh;margin:0 auto;background:#fff;padding-bottom:72px}
.demo{background:#fff4d6;color:#7a5a00;font-size:12px;text-align:center;padding:4px 8px;border-bottom:1px dashed #d9b85c}
.cache-banner{background:#fff4d6;color:#7a5a00;font-size:13px;text-align:center;padding:8px 12px;border-bottom:1px solid #e6d39a}
header{padding:12px 16px 8px;border-bottom:1px solid #e5e5e5}
header h1{font-size:18px}
header .meta{font-size:12px;color:#888}
.sec{padding:12px 16px}
.h2{font-size:14px;color:#555;margin-bottom:8px;font-weight:600}
.h3{font-size:13px;color:#555;margin:12px 0 8px;font-weight:600}
.group:first-child .h3{margin-top:0}
.top{border:2px solid #333;border-radius:6px;padding:10px 12px;margin-bottom:6px}
.top a{color:#222;text-decoration:none;display:block;padding:4px 0}
.card{border:1px solid #ccc;border-radius:6px;padding:10px 12px;margin-bottom:10px;background:#fff;text-decoration:none;color:inherit;display:block}
.card h3{font-size:15px;margin-bottom:2px}
.excerpt{font-size:12px;color:#999;margin:2px 0 4px;display:inline-block;margin-right:8px}
.sample{font-size:11px;color:#7a5a00;border:1px dashed #d9b85c;border-radius:3px;padding:0 4px}
.summary{font-size:13px;color:#555}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:#888;margin-top:6px}
.imp{font-weight:700;color:#222;border:1px solid #222;border-radius:3px;padding:0 4px}
.tag{border:1px solid #999;border-radius:10px;padding:0 6px;font-size:11px;color:#555}
.warn{border:1px dashed #b00;color:#b00;border-radius:3px;padding:0 4px;font-size:11px}
.more{text-align:center;font-size:13px;color:#333;border:1px solid #ccc;border-radius:4px;padding:6px 0;margin:2px 0 12px;background:#fafafa;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;border-bottom:1px solid #eee}
.chip{border:1px solid #999;border-radius:14px;padding:3px 10px;font-size:13px;background:#fff;cursor:pointer}
.chip.on{background:#222;color:#fff;border-color:#222}
.search-bar{display:flex;gap:6px;padding:12px 16px}
.search-bar input{flex:1;border:1px solid #999;border-radius:4px;padding:6px 8px;font-size:14px}
.search-bar button,.btn{border:1px solid #222;background:#fff;color:#222;border-radius:4px;padding:6px 10px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
.search-bar button{background:#222;color:#fff}
.hist{list-style:none}
.hist li{border-bottom:1px solid #eee;padding:12px 0;cursor:pointer}
.state{color:#888;font-size:13px;padding:32px 16px;text-align:center}
.footer{font-size:11px;color:#999;text-align:center;padding:16px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:375px;display:flex;border-top:1px solid #ccc;background:#fafafa}
nav a{flex:1;text-align:center;font-size:12px;padding:10px 0 12px;color:#666;text-decoration:none}
nav a.on{color:#000;font-weight:700}
.block{border-left:3px solid #333;padding-left:8px;margin:10px 0}
.block .bt{font-size:13px;font-weight:600;margin-bottom:2px}
.block .bi{font-size:13px;color:#444;margin:0 0 4px 8px}
.cite{color:#888;font-size:12px}
.orig-title{font-size:12px;color:#888;margin:4px 0 2px;word-break:break-word}
.body{margin:10px 0;font-size:14px;line-height:1.65}
.src-item{font-size:13px;margin:4px 0 4px 8px;word-break:break-all}
.src-item a{color:#1257a6}
.actions{margin-top:14px}
.back{font-size:13px;color:#555;cursor:pointer;padding:10px 16px 0}
</style>
</head>
<body>
<div class="app" id="app"><div class="state">加载中…</div></div>
<nav id="nav">
  <a href="#/home" data-r="home">早报</a>
  <a href="#/category" data-r="category">分类</a>
  <a href="#/search" data-r="search">搜索</a>
  <a href="#/favorites" data-r="favorites">收藏</a>
  <a href="#/history" data-r="history">历史</a>
</nav>
<script>
(function () {
  var DATA_BASE = "./data/";
  var APP_NAME = "薯条早报";
  var CATS = ["大模型与产品","AI公司与融资","研究与论文","芯片与算力","政策与安全","应用案例","行业动态"];
  var PREVIEW = 5;
  var expanded = {};
  var lastDigest = null;
  var corpus = [];

  function pad(n){ return (n<10?"0":"")+n; }
  function toBJ(d){ return new Date(d.getTime()+d.getTimezoneOffset()*60000+8*3600000); }
  function fmtDT(s){
    if(!s) return "";
    var d=new Date(s); if(isNaN(d)) return "";
    var b=toBJ(d);
    return b.getFullYear()+"-"+pad(b.getMonth()+1)+"-"+pad(b.getDate())+" "+pad(b.getHours())+":"+pad(b.getMinutes());
  }
  function fmtHm(s){
    if(!s) return "";
    var d=new Date(s); if(isNaN(d)) return "";
    var b=toBJ(d);
    return pad(b.getHours())+":"+pad(b.getMinutes());
  }
  function dots(n){ n=+n||1; if(n<1)n=1; if(n>3)n=3; return "重要性 "+"●".repeat(n)+"○".repeat(3-n); }
  function cacheGet(k){ try{ var v=localStorage.getItem("h5:"+k); return v?JSON.parse(v):null; }catch(e){ return null; } }
  function cacheSet(k,v){ try{ localStorage.setItem("h5:"+k, JSON.stringify({savedAt:Date.now(),data:v})); }catch(e){} }
  function cacheData(k){ var e=cacheGet(k); return e&&e.data?e.data:null; }

  function parseBody(x){
    if(x==null) throw new Error("empty");
    if(typeof x==="string"){ var s=x.replace(/^\uFEFF/,"").trim(); return JSON.parse(s); }
    return x;
  }
  function delay(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  function request(path, attempt){
    attempt=attempt||0;
    var url = DATA_BASE + path.replace(/^\//,"");
    return fetch(url,{cache:"no-store"}).then(function(res){
      if(!res.ok) throw new Error("HTTP "+res.status);
      return res.text().then(parseBody);
    }).catch(function(err){
      var code=String(err&&err.message||"");
      var retryable=/429|403|502|503|504|Failed|Network|timeout/i.test(code);
      if(attempt<2 && retryable) return delay(400*Math.pow(2,attempt)).then(function(){ return request(path, attempt+1); });
      throw err;
    });
  }

  function fetchLatest(){
    return request("digest/latest.json").then(function(raw){
      cacheSet("digest:latest", raw);
      if(raw&&raw.date) cacheSet("digest:"+raw.date, raw);
      return {data:raw, fromCache:false};
    }).catch(function(err){
      var cached = cacheData("digest:latest");
      if(!cached){
        var keys=Object.keys(localStorage).filter(function(k){ return /^h5:digest:\d{4}-\d{2}-\d{2}$/.test(k); }).sort().reverse();
        if(keys[0]) cached=cacheData(keys[0].slice(3));
      }
      if(cached) return {data:cached, fromCache:true};
      throw err;
    });
  }
  function fetchDigest(date){
    return request("digest/"+date+".json").then(function(raw){
      cacheSet("digest:"+date, raw);
      return {data:raw, fromCache:false};
    }).catch(function(err){
      var cached=cacheData("digest:"+date)||cacheData("digest:latest");
      if(cached) return {data:cached, fromCache:true};
      throw err;
    });
  }
  function fetchDigests(){
    return request("digests.json").then(function(raw){
      cacheSet("digests", raw);
      return {data:raw, fromCache:false};
    }).catch(function(err){
      var cached=cacheData("digests");
      if(cached) return {data:cached, fromCache:true};
      throw err;
    });
  }
  function fetchNews(id){
    return request("news/"+encodeURIComponent(id)+".json").then(function(raw){
      cacheSet("news:"+id, raw);
      return {data:raw, fromCache:false};
    }).catch(function(err){
      var cached=cacheData("news:"+id);
      if(cached) return {data:cached, fromCache:true};
      throw err;
    });
  }

  function visible(it){ return it && it.status!=="hidden"; }
  function primary(it){
    var srcs=it.sources||[];
    var p=srcs.filter(function(s){ return s.is_primary; })[0]||srcs[0]||{};
    return p;
  }
  function statements(arr){
    if(!Array.isArray(arr)) return [];
    return arr.map(function(x){
      if(!x) return null;
      if(typeof x==="string") return {text:x, source:"", url:""};
      return {text:x.text||x.content||"", source:x.source||x.source_name||"", url:x.url||x.source_url||""};
    }).filter(function(x){ return x && x.text; });
  }
  function groupsOf(items){
    var vis=items.filter(visible);
    var g=[];
    CATS.forEach(function(c){
      var list=vis.filter(function(i){ return i.category===c; });
      if(list.length) g.push({category:c, items:list, total:list.length});
    });
    return g;
  }

  function card(it){
    var p=primary(it);
    var mode = it.summary_mode==="ai" ? '<span class="excerpt">AI 摘要</span>' :
               it.summary_mode==="excerpt" ? '<span class="excerpt">原文摘录</span>' : "";
    var badges = mode + (it.verified===false?'<span class="warn">未经独立核实</span>':'') +
      (it.status==="corrected"?'<span class="tag">已更正</span>':'');
    return '<a class="card" href="#/detail/'+encodeURIComponent(it.id)+'">'+
      '<h3>'+esc(it.title||"无标题")+'</h3>'+
      (badges?'<div>'+badges+'</div>':'')+
      (it.summary?'<div class="summary">'+esc(it.summary)+'</div>':'')+
      '<div class="row"><span class="imp">'+dots(it.importance)+'</span>'+
      (it.category?'<span class="tag">'+esc(it.category)+'</span>':'')+
      (p.name?'<span>'+esc(p.name)+'</span>':'')+
      '</div>'+
      (it.published_at?'<div class="row"><span>发布 '+esc(fmtDT(it.published_at))+'</span></div>':'')+
      '</a>';
  }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c]; }); }

  function banner(fromCache, date){
    return fromCache ? '<div class="cache-banner">加载失败，已显示 '+esc(date||"")+' 的缓存早报</div>' : '';
  }
  function digestView(raw, fromCache, moreKey){
    moreKey = moreKey || "home";
    var items=(raw.items||[]).filter(visible);
    var byId={}; items.forEach(function(i){ byId[i.id]=i; });
    var tops=(raw.top_items||[]).map(function(id){ return byId[id]; }).filter(Boolean);
    var html=banner(fromCache, raw.date)+
      '<header><h1>'+APP_NAME+' · '+esc(raw.date||"")+'</h1><div class="meta">'+
      (raw.generated_at?('更新于 '+esc(fmtHm(raw.generated_at))):'')+' · 共 '+items.length+' 条</div></header>';
    if(tops.length){
      html+='<div class="sec"><div class="h2">今日要点（'+tops.length+'）</div><div class="top">'+
        tops.map(function(it,i){ return '<a href="#/detail/'+encodeURIComponent(it.id)+'">'+(i+1)+'. '+esc(it.title)+'</a>'; }).join("")+
        '</div></div>';
    }
    html+='<div class="sec"><div class="h2">全部新闻</div>';
    if(!items.length) html+='<div class="state">今天暂无新闻</div>';
    groupsOf(items).forEach(function(g){
      var key=moreKey+":"+g.category;
      var open=!!expanded[key];
      var shown = (!open && g.total>PREVIEW) ? g.items.slice(0,PREVIEW) : g.items;
      html+='<div class="group"><div class="h3">'+esc(g.category)+'（'+g.total+'）</div>'+shown.map(card).join("");
      if(g.total>PREVIEW){
        if(!open) html+='<div class="more" data-expand="'+esc(key)+'">展开更多（还有 '+(g.total-PREVIEW)+' 条）</div>';
        else html+='<div class="more" data-expand="'+esc(key)+'">收起</div>';
      }
      html+='</div>';
    });
    html+='</div><div class="footer">内容来自公开来源摘录，版权归原作者</div>';
    return html;
  }

  function renderDigest(raw, fromCache, moreKey){
    lastDigest=raw;
    document.getElementById("app").innerHTML=digestView(raw, fromCache, moreKey);
    bindExpand(raw, fromCache, moreKey);
  }
  function bindExpand(raw, fromCache, moreKey){
    document.querySelectorAll("[data-expand]").forEach(function(el){
      el.addEventListener("click", function(){
        var k=el.getAttribute("data-expand");
        expanded[k]=!expanded[k];
        renderDigest(raw, fromCache, moreKey);
      });
    });
  }

  function favs(){ try{ return JSON.parse(localStorage.getItem("h5:favorites")||"[]"); }catch(e){ return []; } }
  function saveFavs(a){ localStorage.setItem("h5:favorites", JSON.stringify(a)); }
  function isFav(id){ return favs().some(function(x){ return x.id===id; }); }
  function toggleFav(item){
    var a=favs().filter(function(x){ return x.id!==item.id; });
    if(a.length===favs().length) a.unshift({id:item.id, savedAt:Date.now(), item:item});
    saveFavs(a);
  }

  function setNav(r){
    document.querySelectorAll("nav a").forEach(function(a){ a.classList.toggle("on", a.dataset.r===r); });
  }

  function route(){
    var hash=(location.hash||"#/home").replace(/^#\/?/,"");
    var parts=hash.split("/");
    var r=parts[0]||"home";
    var arg=parts.slice(1).join("/");
    setNav(["home","category","search","favorites","history"].indexOf(r)>=0?r:"home");
    if(r==="home"){
      document.getElementById("app").innerHTML='<div class="state">加载中…</div>';
      fetchLatest().then(function(res){ renderDigest(res.data, res.fromCache, "home"); })
        .catch(function(){ document.getElementById("app").innerHTML='<div class="state">加载失败，点击重试<br><br><button class="btn" onclick="location.reload()">重试</button><div class="footer">也可以稍后在浏览器刷新本页</div></div>'; });
    } else if(r==="daily"){
      document.getElementById("app").innerHTML='<div class="state">加载中…</div>';
      fetchDigest(arg).then(function(res){ renderDigest(res.data, res.fromCache, "daily-"+arg); })
        .catch(function(){ document.getElementById("app").innerHTML='<div class="state">加载失败，点击重试</div>'; });
    } else if(r==="history"){
      document.getElementById("app").innerHTML='<div class="state">加载中…</div>';
      fetchDigests().then(function(res){
        var list=(res.data&&res.data.digests)||(Array.isArray(res.data)?res.data:[]);
        var html=banner(res.fromCache, list[0]&&list[0].date)+'<header><h1>历史早报</h1><div class="meta">按日期浏览</div></header><div class="sec"><ul class="hist">';
        html+=list.map(function(d){
          return '<li onclick="location.hash=\'#/daily/'+esc(d.date)+'\'"><b>'+esc(d.date)+'</b> 早报 · '+(d.count!=null?d.count:"")+' 条'+
            (d.generated_at?'<div class="row"><span>北京时间 '+esc(fmtHm(d.generated_at))+' 生成</span></div>':'')+'</li>';
        }).join("")||'<div class="state">暂无历史早报</div>';
        html+='</ul></div>';
        document.getElementById("app").innerHTML=html;
      }).catch(function(){ document.getElementById("app").innerHTML='<div class="state">加载失败，点击重试</div>'; });
    } else if(r==="category"){
      document.getElementById("app").innerHTML='<div class="state">加载中…</div>';
      fetchLatest().then(function(res){
        var cur=arg||"";
        var items=(res.data.items||[]).filter(visible);
        var list=cur?items.filter(function(i){ return i.category===cur; }):items;
        var html=banner(res.fromCache, res.data.date)+'<header><h1>分类浏览</h1><div class="meta">按 7 个分类筛选'+(res.data.date?(' · '+res.data.date):'')+'</div></header>';
        html+='<div class="chips"><span class="chip '+(cur?"":"on")+'" onclick="location.hash=\'#/category\'">全部</span>'+
          CATS.map(function(c){ return '<span class="chip '+(cur===c?"on":"")+'" onclick="location.hash=\'#/category/'+encodeURIComponent(c)+'\'">'+esc(c)+'</span>'; }).join("")+'</div>';
        html+='<div class="sec">'+(list.length?list.map(card).join(""):'<div class="state">今天这个分类暂无新闻</div>')+'</div>';
        document.getElementById("app").innerHTML=html;
      }).catch(function(){ document.getElementById("app").innerHTML='<div class="state">加载失败，点击重试</div>'; });
    } else if(r==="search"){
      var kw=decodeURIComponent(arg||"");
      var bar='<header><h1>搜索</h1><div class="meta">按标题和摘要关键词搜索近 7 天早报</div></header><div class="search-bar">'+
        '<input id="kw" value="'+esc(kw)+'" placeholder="输入关键词，如：芯片"><button id="go">搜索</button></div>';
      function paint(list){
        var html=bar+'<div class="sec">';
        if(!kw) html+='<div class="state">热门：大模型 · 芯片 · 融资 · 监管</div>';
        else if(!list.length) html+='<div class="state">没有找到相关新闻</div>';
        else html+='<div class="h2">“'+esc(kw)+'” 共 '+list.length+' 条</div>'+list.map(card).join("");
        html+='</div>';
        document.getElementById("app").innerHTML=html;
        document.getElementById("go").onclick=function(){ location.hash="#/search/"+encodeURIComponent(document.getElementById("kw").value.trim()); };
        document.getElementById("kw").addEventListener("keydown", function(e){ if(e.key==="Enter") document.getElementById("go").click(); });
      }
      document.getElementById("app").innerHTML=bar+'<div class="state">加载中…</div>';
      var load = corpus.length ? Promise.resolve(corpus) : fetchDigests().then(function(res){
        var list=(res.data&&res.data.digests)||[];
        return Promise.all(list.slice(0,7).map(function(d){ return fetchDigest(d.date).then(function(r){ return r.data; }).catch(function(){ return null; }); }));
      }).then(function(digests){
        var map={}, arr=[];
        (digests||[]).forEach(function(d){
          if(!d) return;
          (d.items||[]).forEach(function(it){ if(visible(it)&&it.id&&!map[it.id]){ map[it.id]=1; arr.push(it); } });
        });
        corpus=arr; return arr;
      });
      load.then(function(arr){
        var q=kw.toLowerCase();
        var list=q?arr.filter(function(it){
          return ((it.title||"")+" "+(it.original_title||"")+" "+(it.summary||"")).toLowerCase().indexOf(q)>=0;
        }):[];
        paint(list);
      }).catch(function(){ document.getElementById("app").innerHTML=bar+'<div class="state">加载失败，点击重试</div>'; });
    } else if(r==="favorites"){
      var list=favs().map(function(x){ return x.item; }).filter(Boolean);
      var html='<header><h1>我的收藏</h1><div class="meta">收藏保存在本机（不同步）</div></header><div class="sec">';
      html+=list.length?list.map(card).join(""):'<div class="state">还没有收藏，在详情页点 ☆ 收藏</div>';
      html+='</div>';
      document.getElementById("app").innerHTML=html;
    } else if(r==="detail"){
      document.getElementById("app").innerHTML='<div class="state">加载中…</div>';
      fetchNews(arg).then(function(res){
        var it=res.data||{};
        if(it.status==="hidden"){ document.getElementById("app").innerHTML='<div class="back" onclick="history.back()">‹ 返回</div><div class="state">该新闻已下线</div>'; return; }
        var srcs=it.sources||[];
        var p=primary(it);
        var facts=statements(it.facts), claims=statements(it.claims), analysis=statements(it.analysis);
        function blk(title, rows){
          if(!rows.length) return "";
          return '<div class="block"><div class="bt">'+title+'</div>'+rows.map(function(row){
            var cite=row.source?('<span class="cite">（出处：'+esc(row.source)+'）</span>'):'';
            return '<div class="bi">• '+esc(row.text)+" "+cite+"</div>";
          }).join("")+"</div>";
        }
        var html=banner(res.fromCache, "")+'<div class="back" onclick="history.back()">‹ 返回</div><div class="sec">';
        html+='<h1 style="font-size:18px">'+esc(it.title||"无标题")+"</h1>";
        if(it.original_title) html+='<div class="orig-title">'+esc(it.original_title)+"</div>";
        html+='<div>'+(it.summary_mode==="ai"?'<span class="excerpt">AI 摘要</span>':it.summary_mode==="excerpt"?'<span class="excerpt">原文摘录</span>':'')+"</div>";
        html+='<div class="row"><span class="imp">'+dots(it.importance)+"</span>"+
          (it.category?'<span class="tag">'+esc(it.category)+"</span>":"")+
          (it.status==="corrected"?'<span class="tag">已更正</span>':"")+
          (it.verified===false?'<span class="warn">未经独立核实</span>':it.verified===true?'<span class="tag">有一手来源或多方报道</span>':"")+
          "</div>";
        html+='<div class="row">'+(it.published_at?"<span>发布时间 "+esc(fmtDT(it.published_at))+"</span>":"")+
          (it.updated_at?"<span>内容更新 "+esc(fmtDT(it.updated_at))+"</span>":"")+"</div>";
        if(it.summary) html+='<div class="body">'+esc(it.summary)+"</div>";
        html+=blk("已确认事实", facts)+blk("公司说法", claims)+blk("分析观点", analysis);
        html+='<div class="h2">来源（'+srcs.length+'）</div>';
        html+=srcs.map(function(s){
          return '<div class="src-item">'+(s.is_primary?"<b>[一手] </b>":"")+esc(s.name||"")+
            (s.published_at?" · "+esc(fmtDT(s.published_at)):"")+
            (s.url?' · <a href="'+esc(s.url)+'" target="_blank" rel="noopener">'+esc(s.url)+"</a>":"")+"</div>";
        }).join("");
        var fav=isFav(it.id);
        html+='<div class="actions"><button class="btn" id="fav">'+ (fav?"★ 已收藏":"☆ 收藏") +"</button> "+
          (p.url?'<a class="btn" href="'+esc(p.url)+'" target="_blank" rel="noopener">查看原文</a>':"")+"</div>";
        html+='<div class="footer">内容来自公开来源摘录，版权归原作者。请以原文为准。</div></div>';
        document.getElementById("app").innerHTML=html;
        document.getElementById("fav").onclick=function(){ toggleFav(it); route(); };
      }).catch(function(){ document.getElementById("app").innerHTML='<div class="back" onclick="history.back()">‹ 返回</div><div class="state">加载失败，点击重试</div>'; });
    } else {
      location.hash="#/home";
    }
    window.scrollTo(0,0);
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
